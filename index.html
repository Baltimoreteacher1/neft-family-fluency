<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Five minutes of math practice a day. No accounts, no names, works offline." />
    <meta name="theme-color" content="#1f5f4b" />
    <title>Family Math Fluency</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-t="a11y.skipToMain">Skip to main content</a>

    <div class="shell">
      <header class="topbar">
        <button class="btn btn--ghost btn--small" id="btn-back" hidden data-t="app.back">Back</button>
        <h1 id="page-title" data-t="app.title">Family Math Fluency</h1>
        <button class="btn btn--ghost btn--small" id="btn-settings" aria-label="Settings" title="Settings">&#9881;</button>
      </header>

      <!-- Every view renders into here. One live region serves the whole app so
           a screen reader never has to hunt for where feedback appeared. -->
      <main id="main" tabindex="-1"></main>

      <p class="visually-hidden" id="live" role="status" aria-live="polite"></p>
      <p class="visually-hidden" id="live-assertive" role="alert" aria-live="assertive"></p>
    </div>

    <noscript>
      <div class="shell">
        <div class="card">
          <h2>JavaScript is needed</h2>
          <p>
            This practice app builds its questions on your phone, so it needs
            JavaScript switched on. Nothing is sent anywhere either way.
          </p>
        </div>
      </div>
    </noscript>

    <script type="module" src="app.js"></script>
  </body>
</html>
